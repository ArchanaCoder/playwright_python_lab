[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers --tracing retain-on-failure --screenshot only-on-failure --output artifacts/test-results"
markers = [
  "ui: browser interaction examples",
  "api: HTTP API examples",
  "integration: UI and API workflows",
  "advanced: advanced browser capabilities",
  "chromium: Chromium-only examples",
]
[tool.ruff]
line-length = 100
target-version = "py311"
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
